<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encarta 2.0 - 404 Not Found</title>
    <!-- Tailwind CSS (via CDN for hackathon speed) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/retro.css">
    <style>
        body {
            background-color: #008080; /* Win95 Teal */
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div class="retro-window win95-outset glass-panel" style="width: 500px; max-width: 90vw;">
        <div class="retro-window-titlebar">
            <div class="retro-window-title">
                <span>⚠️</span>
                <span>Error 404: Knowledge Node Not Found</span>
            </div>
            <div class="window-controls">
                <a href="/" class="win-btn close-btn" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">X</a>
            </div>
        </div>
        <div class="panel-body p-6 text-center" style="background: rgba(15, 23, 42, 0.9);">
            <div class="text-6xl mb-4">🛸</div>
            <h2 class="text-amber-400 font-bold text-xl mb-2">Uncharted Territory Detected!</h2>
            <p class="text-slate-300 text-sm mb-6 leading-relaxed">
                The archival network could not locate the requested backlink.<br>
                It may have been lost in the cyberspace void or never existed.
            </p>
            
            <div class="win95-inset bg-black p-4 text-left font-mono text-xs text-green-400 mb-6">
                C:\> DIR /S /B *.*<br>
                Searching...<br>
                File Not Found.<br>
                <br>
                C:\> _
            </div>
            
            <a href="/" class="retro-btn retro-btn-accent" style="display: inline-block; text-decoration: none;">
                Return to Encyclopedia
            </a>
        </div>
    </div>
</body>
</html>
